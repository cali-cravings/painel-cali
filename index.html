<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Gerência — Cali Cravings</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  :root {
    --verde: #2C3E35;
    --verde-escuro: #1e2e27;
    --areia: #F5F0E8;
    --dourado: #C9A96E;
    --dourado-claro: #E8D5B0;
    --cinza: #6B6B5E;
    --verde-ok: #6fcf97;
    --vermelho: #eb8787;
    --azul: #7eb8d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--verde-escuro);
    color: var(--areia);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  /* ── Login ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    background: var(--verde);
    position: relative;
  }

  #login-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(201,169,110,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 70%, rgba(201,169,110,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .login-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    color: var(--dourado);
    letter-spacing: 0.05em;
    z-index: 1;
  }

  .login-logo span { font-style: italic; font-weight: 300; color: var(--areia); }

  .login-badge {
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--cinza);
    z-index: 1;
  }

  .ornament {
    display: flex; align-items: center; gap: 1rem;
    width: 200px; z-index: 1;
  }
  .ornament-line { flex: 1; height: 1px; background: rgba(201,169,110,0.25); }
  .ornament-diamond { width: 5px; height: 5px; background: var(--dourado); transform: rotate(45deg); }

  .login-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 300;
    color: var(--areia);
    z-index: 1;
  }

  .login-input {
    background: rgba(245,240,232,0.06);
    border: 1px solid rgba(201,169,110,0.25);
    color: var(--areia);
    font-family: 'DM Mono', monospace;
    font-size: 1.8rem;
    padding: 0.8rem 1.5rem;
    width: 240px;
    text-align: center;
    letter-spacing: 0.5em;
    outline: none;
    z-index: 1;
    transition: border-color 0.2s;
  }

  .login-input:focus { border-color: var(--dourado); }

  .login-dots {
    display: flex; gap: 0.6rem; z-index: 1;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.4);
    background: transparent;
    transition: all 0.15s;
  }
  .dot.filled { background: var(--dourado); border-color: var(--dourado); }

  .login-error {
    font-size: 0.65rem;
    color: var(--vermelho);
    letter-spacing: 0.1em;
    min-height: 1rem;
    z-index: 1;
  }

  .login-hint {
    font-size: 0.6rem;
    color: rgba(107,107,94,0.5);
    letter-spacing: 0.1em;
    z-index: 1;
    margin-top: 1rem;
  }

  /* ── App principal ── */
  #app { display: none; }

  /* ── Header ── */
  header {
    background: var(--verde);
    border-bottom: 1px solid rgba(201,169,110,0.15);
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky; top: 0; z-index: 50;
  }

  .header-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--dourado);
  }
  .header-logo span { font-style: italic; font-weight: 300; color: var(--areia); }

  .header-right { display: flex; align-items: center; gap: 1rem; }

  .header-badge {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cinza);
    border: 1px solid rgba(107,107,94,0.3);
    padding: 0.25rem 0.6rem;
  }

  .notif-btn {
    position: relative;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0.2rem;
  }

  .notif-badge {
    position: absolute;
    top: -2px; right: -2px;
    width: 8px; height: 8px;
    background: var(--vermelho);
    border-radius: 50%;
    display: none;
  }

  .btn-sair {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    padding: 0.4rem 0.8rem;
    border: 1px solid rgba(201,169,110,0.2);
    background: transparent;
    color: var(--cinza);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-sair:hover { color: var(--vermelho); border-color: rgba(235,135,135,0.3); }

  /* ── Resumo do dia ── */
  .resumo-strip {
    background: var(--verde);
    border-bottom: 1px solid rgba(201,169,110,0.1);
    padding: 1rem 1.5rem;
  }

  .resumo-date {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cinza);
    margin-bottom: 0.8rem;
  }

  .resumo-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.8rem;
  }

  .resumo-card {
    background: rgba(245,240,232,0.04);
    border: 1px solid rgba(201,169,110,0.15);
    padding: 0.8rem 1rem;
  }

  .resumo-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 0.2rem;
  }

  .resumo-label {
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cinza);
  }

  .num-total { color: var(--dourado); }
  .num-pendente { color: #f0c070; }
  .num-confirmado { color: var(--verde-ok); }
  .num-pessoas { color: var(--azul); }

  /* ── Filtros / Controles ── */
  .controls {
    padding: 1rem 1.5rem;
    display: flex;
    gap: 0.8rem;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(201,169,110,0.08);
  }

  .filtro-data {
    background: rgba(245,240,232,0.06);
    border: 1px solid rgba(201,169,110,0.25);
    color: var(--areia);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 0.45rem 0.8rem;
    outline: none;
  }

  .filtro-data:focus { border-color: var(--dourado); }

  .filtro-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.45rem 0.9rem;
    border: 1px solid rgba(201,169,110,0.2);
    background: transparent;
    color: var(--cinza);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filtro-btn:hover, .filtro-btn.ativo {
    border-color: var(--dourado);
    color: var(--dourado);
    background: rgba(201,169,110,0.08);
  }

  .controls-right { margin-left: auto; }

  .btn-hoje {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.45rem 0.9rem;
    border: 1px solid rgba(201,169,110,0.4);
    background: rgba(201,169,110,0.1);
    color: var(--dourado);
    cursor: pointer;
  }

  /* ── Lista de reservas ── */
  .lista-wrap { padding: 1rem 1.5rem 4rem; }

  .lista-header {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cinza);
    margin-bottom: 0.8rem;
  }

  .reservas-lista { display: flex; flex-direction: column; gap: 0.7rem; }

  .reserva-card {
    background: rgba(245,240,232,0.03);
    border: 1px solid rgba(201,169,110,0.15);
    padding: 1rem 1.2rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.8rem;
    align-items: center;
    transition: border-color 0.2s, background 0.2s;
  }

  .reserva-card:hover { border-color: rgba(201,169,110,0.3); background: rgba(245,240,232,0.05); }
  .reserva-card.nova { border-color: rgba(201,169,110,0.5); animation: pulseCard 2s ease 3; }

  @keyframes pulseCard {
    0%, 100% { background: rgba(245,240,232,0.03); }
    50% { background: rgba(201,169,110,0.08); }
  }

  .reserva-nome {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    margin-bottom: 0.3rem;
  }

  .reserva-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    font-size: 0.62rem;
    color: var(--cinza);
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
  }

  .reserva-obs {
    font-size: 0.65rem;
    color: rgba(245,240,232,0.4);
    font-style: italic;
  }

  .reserva-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
  }

  .badge {
    font-size: 0.52rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.2rem 0.55rem;
  }

  .badge-pendente { background: rgba(240,192,112,0.12); color: #f0c070; border: 1px solid rgba(240,192,112,0.3); }
  .badge-confirmado { background: rgba(111,207,151,0.12); color: var(--verde-ok); border: 1px solid rgba(111,207,151,0.3); }
  .badge-cancelado { background: rgba(235,135,135,0.12); color: var(--vermelho); border: 1px solid rgba(235,135,135,0.3); }

  .action-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }

  .btn-acao {
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.08em;
    padding: 0.3rem 0.65rem;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }

  .btn-confirmar { border-color: rgba(111,207,151,0.4); color: var(--verde-ok); }
  .btn-confirmar:hover { background: rgba(111,207,151,0.1); }
  .btn-cancelar { border-color: rgba(235,135,135,0.4); color: var(--vermelho); }
  .btn-cancelar:hover { background: rgba(235,135,135,0.1); }
  .btn-wpp { border-color: rgba(37,211,102,0.4); color: #25D366; }
  .btn-wpp:hover { background: rgba(37,211,102,0.1); }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--cinza);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--verde);
    border: 1px solid rgba(201,169,110,0.3);
    padding: 2rem;
    max-width: 380px;
    width: 90%;
    text-align: center;
  }

  .modal h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 300;
    color: var(--dourado);
    margin-bottom: 0.7rem;
  }

  .modal p { font-size: 0.7rem; color: var(--cinza); margin-bottom: 1.5rem; line-height: 1.7; }

  .modal-btns { display: flex; gap: 0.8rem; justify-content: center; }

  .btn-sim {
    padding: 0.65rem 1.3rem;
    background: var(--vermelho);
    border: none; color: white;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.12em;
    cursor: pointer;
  }

  .btn-nao {
    padding: 0.65rem 1.3rem;
    background: transparent;
    border: 1px solid rgba(245,240,232,0.15);
    color: var(--cinza);
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.12em;
    cursor: pointer;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--dourado);
    color: var(--verde);
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.1em;
    padding: 0.75rem 1.4rem;
    z-index: 500;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Notificação nova reserva ── */
  .nova-notif {
    position: fixed;
    top: 5rem; right: 1.5rem;
    background: var(--verde);
    border: 1px solid var(--dourado);
    padding: 1rem 1.2rem;
    z-index: 300;
    max-width: 260px;
    transform: translateX(300px);
    transition: transform 0.4s ease;
    display: none;
  }
  .nova-notif.show { display: block; transform: translateX(0); }
  .nova-notif-title { font-size: 0.6rem; letter-spacing: 0.2em; color: var(--dourado); margin-bottom: 0.3rem; text-transform: uppercase; }
  .nova-notif-nome { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; margin-bottom: 0.2rem; }
  .nova-notif-info { font-size: 0.62rem; color: var(--cinza); }
  .nova-notif-close { position: absolute; top: 0.5rem; right: 0.7rem; background: none; border: none; color: var(--cinza); cursor: pointer; font-size: 0.8rem; }

  /* Responsivo */
  @media (max-width: 600px) {
    .resumo-cards { grid-template-columns: repeat(2, 1fr); }
    .reserva-card { grid-template-columns: 1fr; }
    .reserva-actions { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    .controls { gap: 0.5rem; }
    .nova-notif { right: 0.5rem; left: 0.5rem; max-width: none; }
  }

  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6) sepia(1) hue-rotate(10deg); }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-logo">Cali <span>Cravings</span></div>
  <div class="login-badge">Painel de Gerência</div>
  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-line"></div>
  </div>
  <div class="login-title">Acesso restrito</div>
  <div class="login-dots" id="login-dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
    <div class="dot" id="d4"></div>
    <div class="dot" id="d5"></div>
  </div>
  <input class="login-input" type="password" id="login-input" maxlength="6"
    placeholder="" autocomplete="off"
    oninput="onSenhaInput()"
    onkeydown="if(event.key==='Enter') verificarSenha()">
  <div class="login-error" id="login-error"></div>
  <div class="login-hint">Digite a senha de 6 dígitos</div>
</div>

<!-- ══ APP ══ -->
<div id="app">

  <!-- Header -->
  <header>
    <div class="header-logo">Cali <span>Cravings</span></div>
    <div class="header-right">
      <span class="header-badge">Gerência</span>
      <button class="notif-btn" title="Notificações" id="notif-btn">🔔<span class="notif-badge" id="notif-badge"></span></button>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <!-- Resumo do dia -->
  <div class="resumo-strip">
    <div class="resumo-date" id="resumo-date"></div>
    <div class="resumo-cards">
      <div class="resumo-card">
        <div class="resumo-num num-total" id="r-total">0</div>
        <div class="resumo-label">Total hoje</div>
      </div>
      <div class="resumo-card">
        <div class="resumo-num num-pendente" id="r-pendente">0</div>
        <div class="resumo-label">Pendentes</div>
      </div>
      <div class="resumo-card">
        <div class="resumo-num num-confirmado" id="r-confirmado">0</div>
        <div class="resumo-label">Confirmadas</div>
      </div>
      <div class="resumo-card">
        <div class="resumo-num num-pessoas" id="r-pessoas">0</div>
        <div class="resumo-label">Pessoas esp.</div>
      </div>
    </div>
  </div>

  <!-- Controles -->
  <div class="controls">
    <input type="date" class="filtro-data" id="filtro-data" onchange="aplicarFiltros()">
    <button class="btn-hoje" onclick="filtrarHoje()">Hoje</button>

    <button class="filtro-btn ativo" onclick="filtrarStatus('todas', this)">Todas</button>
    <button class="filtro-btn" onclick="filtrarStatus('pendente', this)">Pendentes</button>
    <button class="filtro-btn" onclick="filtrarStatus('confirmado', this)">Confirmadas</button>
    <button class="filtro-btn" onclick="filtrarStatus('cancelado', this)">Canceladas</button>
  </div>

  <!-- Lista -->
  <div class="lista-wrap">
    <div class="lista-header" id="lista-header">Carregando...</div>
    <div class="reservas-lista" id="reservas-lista"></div>
  </div>

</div>

<!-- Modal cancelar -->
<div class="modal-overlay" id="modal-cancelar">
  <div class="modal">
    <h3>Cancelar reserva?</h3>
    <p>Esta ação irá marcar a reserva como cancelada. Você pode avisar o cliente pelo WhatsApp.</p>
    <div class="modal-btns">
      <button class="btn-sim" onclick="confirmarCancelamento()">Cancelar reserva</button>
      <button class="btn-nao" onclick="fecharModal()">Voltar</button>
    </div>
  </div>
</div>

<!-- Notificação nova reserva -->
<div class="nova-notif" id="nova-notif">
  <button class="nova-notif-close" onclick="fecharNotif()">✕</button>
  <div class="nova-notif-title">✦ Nova reserva</div>
  <div class="nova-notif-nome" id="notif-nome"></div>
  <div class="nova-notif-info" id="notif-info"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════
//  FIREBASE CONFIG
// ══════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyAjxZxOoMCbJCR86WA6fBD4xjMeF2tUzyM",
  authDomain: "cali-reservas.firebaseapp.com",
  databaseURL: "https://cali-reservas-default-rtdb.firebaseio.com",
  projectId: "cali-reservas",
  storageBucket: "cali-reservas.firebasestorage.app",
  messagingSenderId: "537738028833",
  appId: "1:537738028833:web:6df0f4d936e69234ff0060"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── Config ──
const SENHA = "130130";
const WHATSAPP = "5547989251991";

// ── Estado ──
let todasReservas = [];
let filtroStatus = 'todas';
let filtroData = '';
let reservaIdCancelando = null;
let ultimoCount = null;
let notifTimer = null;

// ══════════════════════
//  LOGIN
// ══════════════════════
function onSenhaInput() {
  const v = document.getElementById('login-input').value;
  for (let i = 0; i < 6; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < v.length);
  }
  document.getElementById('login-error').textContent = '';
  if (v.length === 6) verificarSenha();
}

function verificarSenha() {
  const v = document.getElementById('login-input').value;
  if (v === SENHA) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    iniciarApp();
  } else {
    document.getElementById('login-error').textContent = 'Senha incorreta';
    document.getElementById('login-input').value = '';
    for (let i = 0; i < 6; i++) document.getElementById('d' + i).classList.remove('filled');
    setTimeout(() => document.getElementById('login-error').textContent = '', 2000);
  }
}

function sair() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-input').value = '';
  for (let i = 0; i < 6; i++) document.getElementById('d' + i).classList.remove('filled');
}

// ══════════════════════
//  INIT APP
// ══════════════════════
function iniciarApp() {
  const hoje = new Date().toISOString().split('T')[0];
  filtroData = hoje;
  document.getElementById('filtro-data').value = hoje;
  atualizarResumoDate();
  carregarReservas();
}

function atualizarResumoDate() {
  const d = filtroData ? new Date(filtroData + 'T12:00:00') : new Date();
  const opts = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
  document.getElementById('resumo-date').textContent =
    d.toLocaleDateString('pt-BR', opts).toUpperCase();
}

// ══════════════════════
//  FIREBASE LISTENER
// ══════════════════════
function carregarReservas() {
  db.ref('reservas').on('value', snap => {
    const anterior = todasReservas.length;
    todasReservas = [];
    snap.forEach(child => {
      todasReservas.push({ id: child.key, ...child.val() });
    });
    todasReservas.sort((a, b) => {
      if (a.data !== b.data) return a.data.localeCompare(b.data);
      return a.horario.localeCompare(b.horario);
    });

    // Notificação sonora de nova reserva
    if (ultimoCount !== null && todasReservas.length > ultimoCount) {
      const nova = todasReservas[todasReservas.length - 1];
      tocarSom();
      mostrarNotifNova(nova);
      document.getElementById('notif-badge').style.display = 'block';
    }
    ultimoCount = todasReservas.length;

    atualizarResumo();
    renderLista();
  });
}

// ══════════════════════
//  RESUMO DO DIA
// ══════════════════════
function atualizarResumo() {
  const hoje = filtroData || new Date().toISOString().split('T')[0];
  const doDia = todasReservas.filter(r => r.data === hoje && r.status !== 'cancelado');
  const pendentes = doDia.filter(r => r.status === 'pendente');
  const confirmadas = doDia.filter(r => r.status === 'confirmado');
  const pessoas = doDia.reduce((acc, r) => acc + (parseInt(r.pessoas) || 0), 0);

  document.getElementById('r-total').textContent = doDia.length;
  document.getElementById('r-pendente').textContent = pendentes.length;
  document.getElementById('r-confirmado').textContent = confirmadas.length;
  document.getElementById('r-pessoas').textContent = pessoas;
}

// ══════════════════════
//  RENDER LISTA
// ══════════════════════
function renderLista() {
  let lista = [...todasReservas];

  if (filtroData) lista = lista.filter(r => r.data === filtroData);
  if (filtroStatus !== 'todas') lista = lista.filter(r => r.status === filtroStatus);

  const el = document.getElementById('reservas-lista');
  const header = document.getElementById('lista-header');

  header.textContent = `${lista.length} reserva${lista.length !== 1 ? 's' : ''} encontrada${lista.length !== 1 ? 's' : ''}`;

  if (!lista.length) {
    el.innerHTML = `<div class="empty-state">Nenhuma reserva para este filtro</div>`;
    return;
  }

  el.innerHTML = lista.map(r => {
    const dataFmt = formatarData(r.data);
    const foneNum = limparFone(r.telefone);
    const msg = encodeURIComponent(
      `Olá ${r.nome}! Sua reserva no Cali Cravings para ${dataFmt} às ${r.horario} (${r.pessoas} pessoa${r.pessoas > 1 ? 's' : ''}) foi confirmada. Até lá! 🍽️`
    );
    return `
    <div class="reserva-card" id="card-${r.id}">
      <div>
        <div class="reserva-nome">${r.nome}</div>
        <div class="reserva-meta">
          <span>📅 ${dataFmt}</span>
          <span>🕐 ${r.horario}</span>
          <span>👥 ${r.pessoas} pessoa${r.pessoas > 1 ? 's' : ''}</span>
          <span>📞 ${r.telefone}</span>
        </div>
        ${r.obs ? `<div class="reserva-obs">📝 ${r.obs}</div>` : ''}
      </div>
      <div class="reserva-actions">
        <span class="badge badge-${r.status}">${r.status}</span>
        <div class="action-btns">
          ${r.status === 'pendente' ? `<button class="btn-acao btn-confirmar" onclick="confirmarReserva('${r.id}')">✓ Confirmar</button>` : ''}
          ${r.status !== 'cancelado' ? `<button class="btn-acao btn-cancelar" onclick="pedirCancelamento('${r.id}')">✕ Cancelar</button>` : ''}
          <a class="btn-acao btn-wpp" href="https://wa.me/${foneNum}?text=${msg}" target="_blank">WhatsApp</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════
//  AÇÕES
// ══════════════════════
async function confirmarReserva(id) {
  await db.ref(`reservas/${id}`).update({ status: 'confirmado' });
  showToast('Reserva confirmada!');
}

function pedirCancelamento(id) {
  reservaIdCancelando = id;
  document.getElementById('modal-cancelar').classList.add('open');
}

async function confirmarCancelamento() {
  if (!reservaIdCancelando) return;
  await db.ref(`reservas/${reservaIdCancelando}`).update({ status: 'cancelado' });
  fecharModal();
  showToast('Reserva cancelada');
  reservaIdCancelando = null;
}

function fecharModal() {
  document.getElementById('modal-cancelar').classList.remove('open');
}

// ══════════════════════
//  FILTROS
// ══════════════════════
function filtrarStatus(status, btn) {
  filtroStatus = status;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  renderLista();
}

function filtrarTodasDatas() {
  filtroData = '';
  document.getElementById('filtro-data').value = '';
  document.getElementById('resumo-date').textContent = 'TODAS AS DATAS';
  atualizarResumo();
  renderLista();
}

function filtrarHoje() {
  const hoje = new Date().toISOString().split('T')[0];
  filtroData = hoje;
  document.getElementById('filtro-data').value = hoje;
  atualizarResumoDate();
  atualizarResumo();
  renderLista();
}

function aplicarFiltros() {
  filtroData = document.getElementById('filtro-data').value;
  atualizarResumoDate();
  atualizarResumo();
  renderLista();
}

// ══════════════════════
//  NOTIFICAÇÃO SONORA
// ══════════════════════
function tocarSom() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.3);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.3);
    });
  } catch(e) {}
}

function mostrarNotifNova(r) {
  const el = document.getElementById('nova-notif');
  document.getElementById('notif-nome').textContent = r.nome;
  document.getElementById('notif-info').textContent = `${formatarData(r.data)} · ${r.horario} · ${r.pessoas} pessoa${r.pessoas > 1 ? 's' : ''}`;
  el.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => fecharNotif(), 6000);
}

function fecharNotif() {
  document.getElementById('nova-notif').classList.remove('show');
  document.getElementById('notif-badge').style.display = 'none';
}

document.getElementById('notif-btn').onclick = fecharNotif;

// ══════════════════════
//  UTILS
// ══════════════════════
function formatarData(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function limparFone(fone) {
  const n = fone.replace(/\D/g, '');
  return n.startsWith('55') ? n : '55' + n;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Auto-foco no input de senha
window.onload = () => document.getElementById('login-input').focus();
</script>
